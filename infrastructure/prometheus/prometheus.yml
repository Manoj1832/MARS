global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'benchmark-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['benchmark-app:9000']
    dns_sd_configs:
      - names: ['benchmark-app']
        type: 'A'
        port: 9000
        refresh_interval: 2s

  - job_name: 'mars-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
