events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format mars '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream_time=$upstream_response_time '
                    'upstream_addr=$upstream_addr';

    access_log /var/log/nginx/access.log mars;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 8080;
        server_name localhost;

        set $benchmark_upstream http://benchmark-app:9000;

        location / {
            proxy_pass $benchmark_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        location /health {
            proxy_pass $benchmark_upstream/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /metrics {
            proxy_pass $benchmark_upstream/metrics;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /nginx_status {
            stub_status;
            allow all;
        }
    }
}
